apiVersion: backstage.io/v1alpha1
kind: AiResource
metadata:
  name: rhtas-scan-gitlab
  title: RHTAS GitLab CI Scanner Skill
  namespace: securesign
  description: >
    Scans GitLab CI environments for Red Hat Trusted Artifact Signer integration
    readiness. Connects read-only to GitLab APIs to inspect .gitlab-ci.yml
    pipelines, CI/CD variables, runner capabilities, and network connectivity.
    Evaluates 25 gap detection rules and generates implementation blueprints with
    .gitlab-ci.yml job snippets for signing, verification, and attestation.
  tags:
    - gitlab
    - ci-cd
    - container-signing
    - rhtas
    - devops
    - security
  labels:
    distribution: external
  annotations:
    backstage.io/source-location: url:https://github.com/securesign/tas-integrator/blob/main/plugins/tas-integrator/skills/scan-gitlab/SKILL.md
  links:
    - url: https://github.com/securesign/tas-integrator
      title: Source Repository
      icon: github
    - url: https://docs.redhat.com/en/documentation/red_hat_trusted_artifact_signer
      title: RHTAS Documentation
      icon: docs

spec:
  type: skill
  lifecycle: alpha
  owner: group:redhat/rhtas-leads
  disciplines:
    - devops
    - security
  categories:
    - ci-cd
    - security
    - automation
  agents:
    - claude-code
