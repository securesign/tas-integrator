name: Skillsaw

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Skill Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run skillsaw
        # skillsaw v0 (0.15.0)
        uses: stbenjam/skillsaw@1bf34517f8c38193814a0ff7199d028897fbf344
        with:
          strict: false
