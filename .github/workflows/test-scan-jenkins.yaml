name: test-scan-jenkins

on:
  pull_request:
    branches: [main]
    paths:
      - 'plugins/tas-integrator/skills/scan-jenkins/**'
      - 'plugins/tas-integrator/shared/knowledge-base/**'
      - 'plugins/tas-integrator/shared/templates/jenkins-blueprint.md'
      - 'tests/scan-jenkins/**'
      - 'tests/scan-jenkins-brownfield/**'
      - 'tests/shared/**'
      - '.github/workflows/test-scan-jenkins.yaml'
  push:
    branches: [main]
    paths:
      - 'plugins/tas-integrator/skills/scan-jenkins/**'
      - 'tests/scan-jenkins/**'
      - 'tests/scan-jenkins-brownfield/**'
      - 'tests/shared/**'

jobs:
  scan-jenkins-greenfield:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Build Jenkins test image
        run: docker build -t tas-test-jenkins tests/scan-jenkins/

      - name: Start Jenkins
        run: |
          docker run -d --name tas-test-jenkins -p 8080:8080 tas-test-jenkins
          echo "Waiting for Jenkins to be ready..."
          for i in $(seq 1 30); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" -u admin:admin123 http://localhost:8080/api/json 2>/dev/null || true)
            if [ "$STATUS" = "200" ]; then
              echo "Jenkins is ready (attempt $i)"
              break
            fi
            echo "Attempt $i: HTTP $STATUS"
            sleep 5
          done

      - name: Create test pipeline job
        run: bash tests/scan-jenkins/seed-job.sh

      - name: Run scan-jenkins validation
        run: bash tests/scan-jenkins/test-scan-jenkins.sh

      - name: Jenkins logs
        if: failure()
        run: docker logs tas-test-jenkins

      - name: Cleanup
        if: always()
        run: docker rm -f tas-test-jenkins || true

  scan-jenkins-brownfield:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Build Jenkins test image
        run: docker build -t tas-test-jenkins tests/scan-jenkins/

      - name: Start mock TAS server
        run: |
          python3 tests/shared/mock-tas-server.py &
          echo $! > /tmp/mock-tas.pid
          sleep 1
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8090/fulcio/healthz 2>/dev/null || true)
          echo "Mock TAS server health: HTTP $STATUS"

      - name: Start Jenkins
        run: |
          docker run -d --name tas-test-jenkins -p 8080:8080 tas-test-jenkins
          echo "Waiting for Jenkins to be ready..."
          for i in $(seq 1 30); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" -u admin:admin123 http://localhost:8080/api/json 2>/dev/null || true)
            if [ "$STATUS" = "200" ]; then
              echo "Jenkins is ready (attempt $i)"
              break
            fi
            echo "Attempt $i: HTTP $STATUS"
            sleep 5
          done

      - name: Seed brownfield pipeline and credentials
        run: bash tests/scan-jenkins-brownfield/seed-brownfield-job.sh

      - name: Run brownfield validation
        run: bash tests/scan-jenkins-brownfield/test-scan-brownfield.sh

      - name: Jenkins logs
        if: failure()
        run: docker logs tas-test-jenkins

      - name: Cleanup
        if: always()
        run: |
          docker rm -f tas-test-jenkins || true
          [ -f /tmp/mock-tas.pid ] && kill "$(cat /tmp/mock-tas.pid)" 2>/dev/null || true
