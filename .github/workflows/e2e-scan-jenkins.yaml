name: e2e-scan-jenkins

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

env:
  GO_VERSION: '1.26'
  REGISTRY: ghcr.io
  INGRESS_HOST_TEMPLATE: '%[1]s.%[2]s.127.0.0.1.nip.io'
  TEST_NAMESPACE: test

jobs:
  scan-jenkins-e2e:
    name: Full TAS stack E2E
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Checkout secure-sign-operator
        uses: actions/checkout@v4
        with:
          repository: securesign/secure-sign-operator
          path: secure-sign-operator

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Log in to GitHub Container Registry
        uses: redhat-actions/podman-login@v1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          auth_file_path: /tmp/config.json

      - name: Log in to registry.redhat.io
        uses: redhat-actions/podman-login@v1
        with:
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
          registry: registry.redhat.io
          auth_file_path: /tmp/config.json

      - name: Install Kind cluster
        id: kind
        uses: ./secure-sign-operator/.github/actions/kind-cluster
        with:
          config: ./secure-sign-operator/ci/config.yaml
          keycloak: 'true'
          olm: 'true'

      - name: Add service hosts to /etc/hosts
        run: |
          sudo echo "127.0.0.1 ${{ steps.kind.outputs.oidc_host }}" | sudo tee -a /etc/hosts

      - name: Replace images and deploy operator
        working-directory: secure-sign-operator
        run: |
          make dev-images generate && cat config/default/images.env
          make deploy

      - name: Wait for operator to be ready
        run: |
          kubectl wait --for=condition=available deployment/rhtas-operator-controller-manager --timeout=120s -n openshift-rhtas-operator

      - name: Configure Ingress hostname template
        run: |
          kubectl set env deployment/rhtas-operator-controller-manager -n openshift-rhtas-operator INGRESS_HOST_TEMPLATE="${INGRESS_HOST_TEMPLATE}"
          kubectl rollout status deployment/rhtas-operator-controller-manager -n openshift-rhtas-operator --timeout=120s

      - name: Wait for conversion webhook readiness
        run: |
          for i in $(seq 1 60); do
            kubectl create --dry-run=server -f secure-sign-operator/config/samples/rhtas_v1alpha1_securesign.yaml 2>/dev/null && break
            echo "Waiting for conversion webhook... ($i/60)"
            sleep 2
          done

      - name: Install SecureSign
        run: |
          OIDC_HOST="${{ steps.kind.outputs.oidc_host }}"
          sed -i "s#https://your-oidc-issuer-url#http://${OIDC_HOST}/realms/trusted-artifact-signer#" \
            secure-sign-operator/config/samples/rhtas_v1alpha1_securesign.yaml
          kubectl create ns ${{ env.TEST_NAMESPACE }}
          kubectl create -f secure-sign-operator/config/samples/rhtas_v1alpha1_securesign.yaml -n ${{ env.TEST_NAMESPACE }}
          sleep 1
          kubectl wait --for=condition=Ready securesign/securesign-sample --timeout=5m -n ${{ env.TEST_NAMESPACE }}

      - name: Extract TAS endpoint URLs
        id: tas
        run: |
          REKOR_URL=$(kubectl get rekor -o jsonpath='{.items[0].status.url}' -n ${{ env.TEST_NAMESPACE }})
          FULCIO_URL=$(kubectl get fulcio -o jsonpath='{.items[0].status.url}' -n ${{ env.TEST_NAMESPACE }})
          TUF_URL=$(kubectl get tuf -o jsonpath='{.items[0].status.url}' -n ${{ env.TEST_NAMESPACE }})
          TSA_URL=$(kubectl get timestampauthority -o jsonpath='{.items[0].status.url}' -n ${{ env.TEST_NAMESPACE }})
          OIDC_ISSUER="http://${{ steps.kind.outputs.oidc_host }}/realms/trusted-artifact-signer"

          echo "rekor_url=${REKOR_URL}" >> "$GITHUB_OUTPUT"
          echo "fulcio_url=${FULCIO_URL}" >> "$GITHUB_OUTPUT"
          echo "tuf_url=${TUF_URL}" >> "$GITHUB_OUTPUT"
          echo "tsa_url=${TSA_URL}" >> "$GITHUB_OUTPUT"
          echo "oidc_issuer=${OIDC_ISSUER}" >> "$GITHUB_OUTPUT"

          echo "Rekor:  ${REKOR_URL}"
          echo "Fulcio: ${FULCIO_URL}"
          echo "TUF:    ${TUF_URL}"
          echo "TSA:    ${TSA_URL}"
          echo "OIDC:   ${OIDC_ISSUER}"

      - name: Build Jenkins test image
        run: docker build -t tas-test-jenkins tests/scan-jenkins/

      - name: Start Jenkins
        run: |
          docker run -d --name tas-test-jenkins --network host tas-test-jenkins
          echo "Waiting for Jenkins to be ready..."
          for i in $(seq 1 30); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" -u admin:admin123 http://localhost:8080/api/json 2>/dev/null || true)
            if [ "$STATUS" = "200" ]; then
              echo "Jenkins is ready (attempt $i)"
              break
            fi
            echo "Attempt $i: HTTP $STATUS"
            sleep 5
          done

      - name: Seed E2E pipeline job
        env:
          TAS_REKOR_URL: ${{ steps.tas.outputs.rekor_url }}
          TAS_FULCIO_URL: ${{ steps.tas.outputs.fulcio_url }}
          TAS_TUF_URL: ${{ steps.tas.outputs.tuf_url }}
          TAS_TSA_URL: ${{ steps.tas.outputs.tsa_url }}
          TAS_OIDC_ISSUER: ${{ steps.tas.outputs.oidc_issuer }}
        run: bash tests/scan-jenkins-e2e/seed-e2e-job.sh

      - name: Run E2E validation
        env:
          TAS_REKOR_URL: ${{ steps.tas.outputs.rekor_url }}
          TAS_FULCIO_URL: ${{ steps.tas.outputs.fulcio_url }}
          TAS_TUF_URL: ${{ steps.tas.outputs.tuf_url }}
          TAS_TSA_URL: ${{ steps.tas.outputs.tsa_url }}
          TAS_OIDC_ISSUER: ${{ steps.tas.outputs.oidc_issuer }}
        run: bash tests/scan-jenkins-e2e/test-scan-e2e.sh

      - name: Jenkins logs
        if: failure()
        run: docker logs tas-test-jenkins

      - name: Operator logs
        if: failure()
        run: kubectl logs -n openshift-rhtas-operator deployment/rhtas-operator-controller-manager

      - name: Cleanup
        if: always()
        run: |
          docker rm -f tas-test-jenkins || true
          kind delete cluster || true
